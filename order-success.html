<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Successful | Winkles Nature's Treat Foods</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f9f7f2;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .success-card {
      width: 100%;
      max-width: 560px;
      background: white;
      padding: 45px 30px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    .check {
      width: 72px;
      height: 72px;
      margin: 0 auto 22px;
      border-radius: 50%;
      background: #1f6b45;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: bold;
    }

    h1 {
      color: #1f6b45;
      margin-bottom: 14px;
    }

    p {
      line-height: 1.6;
    }

    .reference {
      margin: 22px 0;
      padding: 14px;
      background: #f5f5f5;
      border-radius: 10px;
      word-break: break-word;
    }

    a {
      display: inline-block;
      margin-top: 15px;
      padding: 13px 24px;
      background: #1f6b45;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="success-card">
    <div class="check">✓</div>

    <h1>Payment Successful!</h1>

    <p>
      Thank you for shopping with Winkles Nature's Treat Foods.
      Your payment has been received successfully.
    </p>

    <div class="reference">
      <strong>Payment Reference:</strong><br>
      <span id="payment-reference">Confirmed</span>
    </div>

    <p>
      We will proceed with your order and contact you with the necessary
      delivery information.
    </p>

    <a href="/">Return to Winkles</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const reference = params.get('reference');

    if (reference) {
      document.getElementById('payment-reference').textContent = reference;
    }
  </script>

</body>
</html>
